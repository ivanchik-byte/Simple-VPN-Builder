root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/vpnbuilder-cp ./cmd/control-plane"
bin = "./tmp/vpnbuilder-cp"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]
exclude_dir = ["assets", "tmp", "vendor", "bin", "docker"]
include_dir = ["cmd/control-plane", "internal", "pkg"]
delay = 1000
stop_on_error = true
log = "air.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true