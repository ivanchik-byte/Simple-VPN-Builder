version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vpnbuilder-postgres
    environment:
      POSTGRES_DB: vpnbuilder
      POSTGRES_USER: vpnbuilder
      POSTGRES_PASSWORD: vpnbuilder
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U vpnbuilder -d vpnbuilder -qtAc 'SELECT 1;' > /dev/null || pg_isready -U vpnbuilder -d vpnbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vpnbuilder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ..
      dockerfile: docker/control-plane.Dockerfile
    container_name: vpnbuilder-cp
    env_file:
      - .env
    environment:
      VPNBUILDER_SERVER_HTTP_ADDR: ":8080"
      VPNBUILDER_SERVER_GRPC_ADDR: ":9090"
      VPNBUILDER_DATABASE_DSN: "postgres://vpnbuilder:vpnbuilder@postgres:5432/vpnbuilder?sslmode=disable"
      VPNBUILDER_REDIS_ADDR: "redis:6379"
      VPNBUILDER_AUTH_JWT_SECRET: "dev-secret-change-in-production-at-least-32-chars"
      VPNBUILDER_AUTH_JWT_ACCESS_TTL: "15m"
      VPNBUILDER_AUTH_JWT_REFRESH_TTL: "168h"
      VPNBUILDER_AUTH_BCRYPT_COST: "12"
      VPNBUILDER_CA_CERT_FILE: "/etc/vpnbuilder/ca.pem"
      VPNBUILDER_CA_KEY_FILE: "/etc/vpnbuilder/ca-key.pem"
      VPNBUILDER_CA_CERT_TTL: "720h"
      VPNBUILDER_ADAPTER_WIREGUARD_INTERFACE_PREFIX: "wg"
      VPNBUILDER_ADAPTER_WIREGUARD_SUBNET_V4: "10.8.0.0/16"
      VPNBUILDER_ADAPTER_WIREGUARD_SUBNET_V6: "fd00::/64"
      VPNBUILDER_ADAPTER_WIREGUARD_DNS: "1.1.1.1,1.0.0.1"
      VPNBUILDER_ADAPTER_WIREGUARD_MTU: "1280"
      VPNBUILDER_LOG_LEVEL: "debug"
      VPNBUILDER_LOG_FORMAT: "json"
      CONTROL_PLANE_API_KEY: "dev-key-change-in-production"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./certs:/etc/vpnbuilder:ro

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    container_name: vpnbuilder-bot
    env_file:
      - .env
    environment:
      CONTROL_PLANE_URL: "http://control-plane:8080"
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped

  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    container_name: vpnbuilder-agent
    environment:
      VPNBUILDER_AGENT_NODE_NAME: "agent-1"
      VPNBUILDER_AGENT_CONTROL_PLANE: "control-plane:9090"
      VPNBUILDER_AGENT_CA_CERT: "/etc/vpnbuilder/ca.pem"
      VPNBUILDER_AGENT_CERT_FILE: "/etc/vpnbuilder/agent.pem"
      VPNBUILDER_AGENT_KEY_FILE: "/etc/vpnbuilder/agent-key.pem"
      VPNBUILDER_AGENT_SYNC_INTERVAL: "30s"
      VPNBUILDER_AGENT_METRICS_INTERVAL: "30s"
      VPNBUILDER_AGENT_WIREGUARD_INTERFACE_PREFIX: "wg"
      VPNBUILDER_LOG_LEVEL: "debug"
      VPNBUILDER_LOG_FORMAT: "json"
    depends_on:
      control-plane:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./certs:/etc/vpnbuilder:ro
      - /lib/modules:/lib/modules:ro
    privileged: true

volumes:
  postgres_data:
  redis_data: