version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vpnbuilder-postgres
    environment:
      POSTGRES_DB: vpnbuilder
      POSTGRES_USER: vpnbuilder
      POSTGRES_PASSWORD: vpnbuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbuilder -d vpnbuilder"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vpnbuilder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: ..
      dockerfile: docker/control-plane.Dockerfile
    container_name: vpnbuilder-cp
    environment:
      SERVER_HTTP_ADDR: ":8080"
      SERVER_GRPC_ADDR: ":9090"
      DATABASE_DSN: "postgres://vpnbuilder:vpnbuilder@postgres:5432/vpnbuilder?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      AUTH_JWT_SECRET: "dev-secret-change-in-production-at-least-32-chars"
      AUTH_JWT_ACCESS_TTL: "15m"
      AUTH_JWT_REFRESH_TTL: "168h"
      AUTH_BCRYPT_COST: "12"
      CA_CERT_FILE: "/etc/vpnbuilder/ca.pem"
      CA_KEY_FILE: "/etc/vpnbuilder/ca-key.pem"
      CA_CERT_TTL: "720h"
      ADAPTER_WIREGUARD_INTERFACE_PREFIX: "wg"
      ADAPTER_WIREGUARD_SUBNET_V4: "10.8.0.0/16"
      ADAPTER_WIREGUARD_SUBNET_V6: "fd00::/64"
      ADAPTER_WIREGUARD_DNS: "1.1.1.1,1.0.0.1"
      ADAPTER_WIREGUARD_MTU: "1280"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "json"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./certs:/etc/vpnbuilder:ro

  agent:
    build:
      context: ..
      dockerfile: docker/agent.Dockerfile
    container_name: vpnbuilder-agent
    environment:
      AGENT_NODE_NAME: "agent-1"
      AGENT_CONTROL_PLANE: "control-plane:9090"
      AGENT_CA_CERT: "/etc/vpnbuilder/ca.pem"
      AGENT_CERT_FILE: "/etc/vpnbuilder/agent.pem"
      AGENT_KEY_FILE: "/etc/vpnbuilder/agent-key.pem"
      AGENT_SYNC_INTERVAL: "30s"
      AGENT_METRICS_INTERVAL: "30s"
      AGENT_WIREGUARD_INTERFACE_PREFIX: "wg"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "json"
    depends_on:
      control-plane:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./certs:/etc/vpnbuilder:ro
      - /lib/modules:/lib/modules:ro
    privileged: true

volumes:
  postgres_data:
  redis_data: