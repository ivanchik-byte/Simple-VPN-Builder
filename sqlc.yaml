version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/controlplane/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/controlplane/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "inet"
            go_type: "net.IP"
          - db_type: "cidr"
            go_type: "net.IPNet"