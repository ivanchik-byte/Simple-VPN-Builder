openapi: 3.1.0
info:
  title: Simple-VPN-Builder Control Plane API
  version: 1.0.0
  description: High-performance VPN orchestration and client protocol provisioning control plane.

servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /healthz:
    get:
      summary: Liveness Probe
      operationId: getHealthz
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness Probe
      operationId: getReadyz
      responses:
        '200':
          description: All dependencies connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Upstream dependency degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      summary: Administrator Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid credentials or missing 2FA code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or revoked refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      summary: Invalidate Session and Revoke Token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: logged_out

  /api/v1/auth/totp/setup:
    post:
      summary: Provision TOTP 2FA Secret
      operationId: setupTOTP
      security:
        - bearerAuth: []
      responses:
        '200':
          description: TOTP secret and provisioning URI generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPSetupResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/totp/verify:
    post:
      summary: Verify Code and Activate TOTP
      operationId: verifyTOTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPVerifyRequest'
      responses:
        '200':
          description: Two-factor authentication successfully enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: totp_enabled
        '400':
          description: Invalid passcode or secret
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /nodes:
    get:
      tags: [Nodes]
      summary: List VPN nodes
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Paginated list of nodes
    post:
      tags: [Nodes]
      summary: Register a new node
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Node created successfully

  /nodes/{id}:
    get:
      tags: [Nodes]
      summary: Get node details
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Node details
    patch:
      tags: [Nodes]
      summary: Update node
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Node updated
    delete:
      tags: [Nodes]
      summary: Delete node
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Node deleted

  /users:
    get:
      tags: [Users]
      summary: List VPN users
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Paginated list of users
    post:
      tags: [Users]
      summary: Create VPN user
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: User created

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user details
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
    patch:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete user
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted

  /plans:
    get:
      tags: [Plans]
      summary: List subscription plans
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of plans
    post:
      tags: [Plans]
      summary: Create subscription plan
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Plan created

  /credentials:
    get:
      tags: [Credentials]
      summary: List credentials
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: List of credentials
    post:
      tags: [Credentials]
      summary: Provision credential
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '201':
          description: Credential provisioned

  /credentials/{id}/rotate:
    post:
      tags: [Credentials]
      summary: Rotate credential key pair
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: New keypair generated and stored

  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Global traffic overview
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Aggregate traffic overview

  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of issued API keys
    post:
      tags: [API Keys]
      summary: Issue API key
      security:
        - bearerAuth: []
      responses:
        '201':
          description: API key issued with plaintext raw token returned once

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - postgres
        - redis
      properties:
        status:
          type: string
          example: ok
        postgres:
          type: string
          example: ok
        redis:
          type: string
          example: ok

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: supersecret
        totp_code:
          type: string
          example: "123456"

    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    TOTPSetupResponse:
      type: object
      required:
        - secret
        - otpauth_url
      properties:
        secret:
          type: string
          example: JBSWY3DPEHPK3PXP
        otpauth_url:
          type: string
          example: otpauth://totp/Simple-VPN-Builder:admin@example.com?secret=JBSWY3DPEHPK3PXP&issuer=Simple-VPN-Builder

    TOTPVerifyRequest:
      type: object
      required:
        - secret
        - code
      properties:
        secret:
          type: string
        code:
          type: string
          example: "123456"

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        invalid_params:
          type: object
          additionalProperties:
            type: string
