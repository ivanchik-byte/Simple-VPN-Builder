apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cp
  labels:
    app.kubernetes.io/name: vpnbuilder-cp
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.controlPlane.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: vpnbuilder-cp
    app.kubernetes.io/instance: {{ .Release.Name }}
