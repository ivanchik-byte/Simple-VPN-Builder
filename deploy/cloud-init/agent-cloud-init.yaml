#cloud-config
# ==============================================================================
# Simple-VPN-Builder Cloud-Init Exit Node Provisioning Template
# Supported Providers: Hetzner Cloud, DigitalOcean, Vultr, AWS EC2, Linode
# ==============================================================================

package_update: true
package_upgrade: false

packages:
  - wireguard-tools
  - nftables
  - iptables
  - curl
  - jq
  - ca-certificates
  - tar

write_files:
  - path: /etc/sysctl.d/99-vpnbuilder.conf
    permissions: '0644'
    content: |
      # IP Packet Forwarding for VPN tunnels
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
      # High-performance BBR congestion control
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr
      # High-bandwidth buffer optimizations
      net.core.rmem_max = 67108864
      net.core.wmem_max = 67108864
      net.ipv4.tcp_rmem = 4096 87380 33554432
      net.ipv4.tcp_wmem = 4096 65536 33554432

  - path: /etc/systemd/system/vpnbuilder-agent.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Simple-VPN-Builder Node Agent
      Documentation=https://github.com/ivanchik-byte/Simple-VPN-Builder
      After=network.target network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/vpnbuilder-agent -config /etc/vpnbuilder/agent.yaml
      Restart=always
      RestartSec=5s
      LimitNOFILE=65535
      CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
      AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/vpnbuilder/agent.yaml
    permissions: '0600'
    content: |
      agent:
        node_name: "exit-node-auto"
        control_plane: "cp.vpn.example.com:9090"
        sync_interval: "30s"
        metrics_interval: "30s"
        wireguard:
          interface_prefix: "wg"
      log:
        level: "info"
        format: "json"

runcmd:
  # 1. Apply kernel sysctl settings
  - sysctl -p /etc/sysctl.d/99-vpnbuilder.conf
  # 2. Ensure WireGuard kernel module is active
  - modprobe wireguard || true
  - modprobe amneziawg || true
  # 3. Download and install latest release binary
  - |
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64|amd64) TARCH="amd64" ;;
      aarch64|arm64) TARCH="arm64" ;;
      *) echo "Unsupported arch: $ARCH"; exit 1 ;;
    esac
    VERSION=$(curl -sI -o /dev/null -w "%{url_effective}" "https://github.com/ivanchik-byte/Simple-VPN-Builder/releases/latest" | xargs basename)
    if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
      VERSION="v0.1.0"
    fi
    curl -sSL "https://github.com/ivanchik-byte/Simple-VPN-Builder/releases/download/${VERSION}/vpnbuilder_${VERSION#v}_linux_${TARCH}.tar.gz" -o /tmp/agent.tar.gz
    tar -xzf /tmp/agent.tar.gz -C /usr/local/bin/ vpnbuilder-agent
    chmod 0755 /usr/local/bin/vpnbuilder-agent
    rm -f /tmp/agent.tar.gz
  # 4. Activate and start agent service
  - systemctl daemon-reload
  - systemctl enable --now vpnbuilder-agent.service
