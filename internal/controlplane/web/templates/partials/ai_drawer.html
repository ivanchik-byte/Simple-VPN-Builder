{{define "ai_drawer"}}
<!-- Slide-over AI Infra Copilot Drawer -->
<div x-data="aiCopilotDrawer()"
     @open-ai-copilot.window="openDrawer()"
     @keydown.escape.window="isOpen && closeDrawer()"
     class="relative z-50">

  <!-- Backdrop overlay -->
  <div x-show="isOpen"
       x-transition:enter="transition-opacity ease-linear duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition-opacity ease-linear duration-200"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click="closeDrawer()"
       class="fixed inset-0 bg-black/60 backdrop-blur-xs"
       style="display: none;"></div>

  <!-- Slide-out Container -->
  <div x-show="isOpen"
       x-transition:enter="transition ease-in-out duration-300 transform"
       x-transition:enter-start="-translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in-out duration-300 transform"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 left-0 max-w-full flex"
       style="display: none;">

    <div class="w-screen max-w-md bg-[var(--bg-surface)] border-r border-[var(--border-subtle)] shadow-2xl flex flex-col justify-between">
      
      <!-- Drawer Header -->
      <div class="p-4 border-b border-[var(--border-subtle)] flex items-center justify-between bg-[var(--bg-surface)]">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-600 to-indigo-700 flex items-center justify-center text-white shadow-xs">
            <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <div class="text-sm font-semibold text-[var(--text-primary)] flex items-center space-x-2">
              <span>Infra Copilot</span>
              <span class="px-1.5 py-0.2 rounded bg-violet-500/10 text-violet-400 border border-violet-500/20 text-[9px] font-mono uppercase">AI Agent</span>
            </div>
            <div class="text-[11px] text-[var(--text-muted)] font-mono">Operations & Diagnostics</div>
          </div>
        </div>

        <div class="flex items-center space-x-1">
          <button type="button" @click="clearMessages()" title="Clear chat history" class="p-1.5 rounded text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)] transition-colors cursor-pointer">
            <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
          </button>
          <button type="button" @click="closeDrawer()" title="Close drawer" class="p-1.5 rounded text-[var(--text-muted)] hover:text-[var(--text-primary)] hover:bg-[var(--bg-hover)] transition-colors cursor-pointer">
            <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Action Chips -->
      <div class="px-4 py-2 border-b border-[var(--border-subtle)] bg-[var(--bg-subtle)] flex items-center space-x-1.5 overflow-x-auto text-[11px] scrollbar-none">
        <button type="button" @click="sendQuickPrompt('Run cluster health diagnostics on all nodes')" class="shrink-0 px-2 py-1 rounded bg-[var(--bg-surface)] hover:bg-[var(--bg-hover)] border border-[var(--border-default)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
          Node Health
        </button>
        <button type="button" @click="sendQuickPrompt('Find top bandwidth consuming users')" class="shrink-0 px-2 py-1 rounded bg-[var(--bg-surface)] hover:bg-[var(--bg-hover)] border border-[var(--border-default)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
          Bandwidth Hogs
        </button>
        <button type="button" @click="sendQuickPrompt('Check telegram bot status and webhook health')" class="shrink-0 px-2 py-1 rounded bg-[var(--bg-surface)] hover:bg-[var(--bg-hover)] border border-[var(--border-default)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
          Bot Status
        </button>
        <button type="button" @click="sendQuickPrompt('Summary of active nodes and cluster telemetry')" class="shrink-0 px-2 py-1 rounded bg-[var(--bg-surface)] hover:bg-[var(--bg-hover)] border border-[var(--border-default)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors cursor-pointer">
          Cluster Stats
        </button>
      </div>

      <!-- Messages Stream Area -->
      <div class="flex-1 p-4 overflow-y-auto space-y-3 font-sans text-xs" id="ai-messages-container">
        <!-- Welcome banner -->
        <template x-if="messages.length === 0">
          <div class="p-3.5 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-subtle)] text-[var(--text-secondary)] space-y-2">
            <div class="font-semibold text-[var(--text-primary)]">AI Infrastructure Copilot</div>
            <p class="leading-relaxed">
              I can inspect cluster nodes, run automated diagnostics, find high bandwidth consumers, manage access bans, and trigger service maintenance.
            </p>
            <div class="text-[11px] text-[var(--text-muted)] font-mono">
              Mutating actions always require your explicit two-phase confirmation.
            </div>
          </div>
        </template>

        <!-- Message List -->
        <template x-for="(msg, idx) in messages" :key="idx">
          <div class="space-y-2">
            <!-- User Bubble -->
            <template x-if="msg.role === 'user'">
              <div class="flex justify-end">
                <div class="max-w-[85%] rounded-lg px-3 py-2 bg-violet-600 text-white shadow-xs">
                  <p class="whitespace-pre-wrap" x-text="msg.content"></p>
                </div>
              </div>
            </template>

            <!-- Assistant Bubble -->
            <template x-if="msg.role === 'assistant'">
              <div class="flex justify-start">
                <div class="max-w-[95%] rounded-lg px-3 py-2.5 bg-[var(--bg-subtle)] border border-[var(--border-subtle)] text-[var(--text-primary)] space-y-2 shadow-xs w-full">
                  <div class="whitespace-pre-wrap leading-relaxed font-sans" x-text="msg.content"></div>

                  <!-- Tool Execution Badges -->
                  <template x-if="msg.toolEvents && msg.toolEvents.length > 0">
                    <div class="pt-2 border-t border-[var(--border-subtle)] space-y-1.5">
                      <template x-for="te in msg.toolEvents">
                        <div class="flex items-center space-x-1.5 text-[10px] font-mono text-[var(--text-muted)]">
                          <svg class="w-3 h-3 text-emerald-400 shrink-0" width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                          </svg>
                          <span class="font-semibold text-[var(--text-secondary)]" x-text="te.name"></span>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Confirmation Action Card -->
                  <template x-if="msg.proposal">
                    <div class="mt-3 p-3 rounded border border-amber-500/30 bg-amber-500/10 text-amber-300 space-y-2">
                      <div class="flex items-center space-x-1.5 text-xs font-semibold">
                        <svg class="w-4 h-4 text-amber-400 shrink-0" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <span>Confirmation Required</span>
                      </div>
                      <div class="text-[11px] text-[var(--text-secondary)]" x-text="msg.proposal.target_summary"></div>
                      <div class="text-[10px] font-mono text-amber-400/90" x-text="msg.proposal.warning_message"></div>
                      
                      <div class="pt-2 flex items-center justify-end space-x-2">
                        <button type="button" 
                                @click="cancelProposal(msg)" 
                                class="px-2.5 py-1 rounded border border-[var(--border-default)] bg-[var(--bg-surface)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] text-[11px] font-mono cursor-pointer transition-colors">
                          Cancel
                        </button>
                        <button type="button" 
                                @click="executeProposal(msg.proposal)" 
                                :disabled="msg.proposalExecuting"
                                class="px-3 py-1 rounded bg-amber-600 hover:bg-amber-500 text-white text-[11px] font-medium tracking-wide uppercase transition-colors cursor-pointer flex items-center space-x-1">
                          <span x-text="msg.proposalExecuting ? 'Executing...' : 'Approve & Execute'"></span>
                        </button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Streaming / Thinking indicator -->
        <template x-if="isLoading">
          <div class="flex items-center space-x-2 text-[var(--text-muted)] text-[11px] font-mono py-1">
            <svg class="animate-spin w-3.5 h-3.5 text-violet-400" width="14" height="14" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span x-text="statusMessage || 'Processing inquiry...'"></span>
          </div>
        </template>
      </div>

      <!-- Drawer Input Footer -->
      <div class="p-3 border-t border-[var(--border-subtle)] bg-[var(--bg-surface)]">
        <form @submit.prevent="sendMessage()" class="flex items-end space-x-2">
          <div class="flex-1 min-w-0">
            <textarea x-model="inputText"
                      @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
                      rows="1"
                      placeholder="Ask copilot or type an operational command..."
                      class="w-full resize-none rounded-lg border border-[var(--border-default)] bg-[var(--bg-input)] px-3 py-2 text-xs text-[var(--text-primary)] focus:outline-hidden focus:ring-1 focus:ring-violet-500 focus:border-violet-500 transition-colors placeholder:text-[var(--text-muted)]"
                      style="min-height: 38px; max-height: 120px;"></textarea>
          </div>
          <button type="submit" 
                  :disabled="isLoading || !inputText.trim()"
                  class="h-[38px] px-3.5 rounded-lg bg-violet-600 hover:bg-violet-500 disabled:opacity-50 disabled:pointer-events-none text-white font-medium text-xs transition-colors shrink-0 flex items-center justify-center cursor-pointer shadow-xs">
            <svg class="w-4 h-4" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<script>
function aiCopilotDrawer() {
  return {
    isOpen: false,
    isLoading: false,
    inputText: '',
    statusMessage: '',
    messages: [],

    init() {
      // Restore persisted messages from session storage
      try {
        const saved = sessionStorage.getItem('ai_copilot_history');
        if (saved) {
          this.messages = JSON.parse(saved);
        }
      } catch (e) {}
    },

    openDrawer() {
      this.isOpen = true;
      this.scrollToBottom();
    },

    closeDrawer() {
      this.isOpen = false;
    },

    clearMessages() {
      this.messages = [];
      sessionStorage.removeItem('ai_copilot_history');
    },

    sendQuickPrompt(text) {
      this.inputText = text;
      this.sendMessage();
    },

    scrollToBottom() {
      setTimeout(() => {
        const container = document.getElementById('ai-messages-container');
        if (container) {
          container.scrollTop = container.scrollHeight;
        }
      }, 50);
    },

    async sendMessage() {
      const text = this.inputText.trim();
      if (!text || this.isLoading) return;

      this.messages.push({ role: 'user', content: text });
      this.inputText = '';
      this.isLoading = true;
      this.statusMessage = 'Connecting to agent...';
      this.scrollToBottom();

      const assistantMsg = {
        role: 'assistant',
        content: '',
        toolEvents: [],
        proposal: null,
      };
      this.messages.push(assistantMsg);

      // Build payload history
      const history = this.messages
        .filter(m => m.role === 'user' || (m.role === 'assistant' && m.content))
        .map(m => ({ role: m.role, content: m.content }));

      try {
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        const resp = await fetch('/api/v1/ai/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken || ''
          },
          body: JSON.stringify({ messages: history })
        });

        if (!resp.ok) {
          const errText = await resp.text();
          assistantMsg.content = 'Error: ' + errText;
          this.isLoading = false;
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop(); // keep partial line

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed.startsWith('data: ')) {
              try {
                const event = JSON.parse(trimmed.substring(6));
                if (event.type === 'token') {
                  assistantMsg.content += event.content;
                } else if (event.type === 'tool_start') {
                  this.statusMessage = 'Executing tool: ' + event.tool_name + '...';
                  assistantMsg.toolEvents.push({ name: event.tool_name, args: event.tool_args });
                } else if (event.type === 'proposal') {
                  assistantMsg.proposal = event.proposal;
                } else if (event.type === 'error') {
                  assistantMsg.content += '\n[System Error]: ' + event.content;
                } else if (event.type === 'done') {
                  this.isLoading = false;
                }
                this.scrollToBottom();
              } catch (err) {}
            }
          }
        }
      } catch (e) {
        assistantMsg.content = 'Network error: ' + e.message;
      } finally {
        this.isLoading = false;
        this.statusMessage = '';
        try {
          sessionStorage.setItem('ai_copilot_history', JSON.stringify(this.messages));
        } catch (e) {}
        this.scrollToBottom();
      }
    },

    cancelProposal(msg) {
      msg.proposal = null;
      msg.content += '\n\n*Action cancelled by operator.*';
    },

    async executeProposal(proposal) {
      proposal.proposalExecuting = true;
      try {
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        const resp = await fetch('/api/v1/ai/actions/' + proposal.confirmation_token + '/execute', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken || ''
          },
          body: JSON.stringify({
            action_name: proposal.action_name,
            parameters: proposal.parameters
          })
        });

        const data = await resp.json();
        if (data.success) {
          proposal.target_summary = 'Completed: ' + proposal.action_name;
          proposal.warning_message = data.result?.message || 'Operation executed successfully.';
          delete proposal.confirmation_token;
        } else {
          proposal.warning_message = 'Failed: ' + (data.error || 'Execution error');
        }
      } catch (err) {
        proposal.warning_message = 'Error executing action: ' + err.message;
      } finally {
        proposal.proposalExecuting = false;
      }
    }
  };
}
</script>
{{end}}
