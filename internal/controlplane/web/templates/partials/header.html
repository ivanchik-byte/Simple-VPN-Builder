{{define "header"}}
<header class="sticky top-0 z-20 h-14 border-b border-[var(--border-subtle)] bg-[var(--bg-surface)]/90 backdrop-blur-sm px-4 md:px-8 flex items-center justify-between">
  <!-- Left Title / Breadcrumbs -->
  <div class="flex items-center space-x-3">
    <div class="text-sm font-semibold tracking-tight text-[var(--text-primary)]">
      {{block "page_title" .}}System Overview{{end}}
    </div>
    <span class="text-xs text-[var(--text-muted)] font-mono hidden md:inline">|</span>
    <span class="text-xs text-[var(--text-muted)] font-mono hidden md:inline">{{block "page_subtitle" .}}Operational Node Telemetry{{end}}</span>
  </div>

  <!-- Right Actions & Theme Switcher -->
  <div class="flex items-center space-x-3">
    <!-- Theme Toggle Button -->
    <button @click="toggleTheme()" type="button" title="Toggle Theme" class="p-1.5 rounded border border-[var(--border-subtle)] bg-[var(--bg-hover)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors">
      <!-- Moon Icon (Dark Mode Active) -->
      <svg x-show="theme === 'dark'" class="w-4 h-4 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
      <!-- Sun Icon (Light Mode Active) -->
      <svg x-show="theme === 'light'" class="w-4 h-4 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    </button>

    <!-- Operational Status Badge -->
    <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded border border-emerald-500/20 bg-emerald-500/10 text-emerald-500 text-xs font-mono">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-medium">CLUSTER ACTIVE</span>
    </div>
  </div>
</header>
{{end}}
