{{define "title"}}Login — Simple-VPN-Builder Control Plane{{end}}

{{define "content"}}
<div class="w-full max-w-sm rounded border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-6 shadow-lg">
  <div class="mb-6 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-950 via-slate-900 to-violet-950 border border-violet-500/40 shadow-inner mb-3">
      <svg class="w-7 h-7 text-violet-400 drop-shadow-[0_0_10px_rgba(139,92,246,0.7)]" viewBox="0 0 32 32" fill="none">
        <polygon points="16,5 26,11 26,21 16,27 6,21 6,11" stroke="currentColor" stroke-width="2" />
        <path d="M16,5 L16,12 M26,11 L20,14.5 M26,21 L20,17.5 M16,27 L16,20 M6,21 L12,17.5 M6,11 L12,14.5" stroke="#a855f7" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
        <circle cx="16" cy="16" r="3.5" fill="#c084fc" />
        <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
      </svg>
    </div>
    <h1 class="text-lg font-semibold tracking-tight text-[var(--text-primary)]">Admin Access</h1>
    <p class="text-xs text-[var(--text-muted)] font-mono mt-1">Multi-Node Control Plane</p>
  </div>

  {{if .Error}}
    <div class="mb-4 p-2.5 rounded border border-rose-500/20 bg-rose-500/10 text-rose-500 text-xs font-mono">
      {{.Error}}
    </div>
  {{end}}

  <form action="/admin/login" method="POST" class="space-y-4">
    <div>
      <label for="username" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Email or Username</label>
      <input type="text" id="username" name="username" value="admin@vpnbuilder.local" required autofocus autocomplete="username"
        class="w-full px-3 py-1.5 rounded border border-[var(--border-default)] bg-[var(--bg-canvas)] text-[var(--text-primary)] text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 font-mono">
    </div>

    <div>
      <label for="password" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">Password</label>
      <input type="password" id="password" name="password" value="Admin1234!" required autocomplete="current-password"
        class="w-full px-3 py-1.5 rounded border border-[var(--border-default)] bg-[var(--bg-canvas)] text-[var(--text-primary)] text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 font-mono">
    </div>

    <div>
      <label for="totp_code" class="block text-xs font-medium text-[var(--text-secondary)] mb-1">
        2FA TOTP Code <span class="text-[var(--text-muted)] font-normal">(if enabled)</span>
      </label>
      <input type="text" id="totp_code" name="totp_code" placeholder="000000" maxlength="6" autocomplete="one-time-code"
        class="w-full px-3 py-1.5 rounded border border-[var(--border-default)] bg-[var(--bg-canvas)] text-[var(--text-primary)] text-sm focus:outline-none focus:ring-1 focus:ring-zinc-400 font-mono tracking-widest text-center">
    </div>

    <button type="submit" class="w-full mt-2 py-2 px-4 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-100 dark:bg-zinc-100 dark:hover:bg-zinc-200 dark:text-zinc-950 font-medium text-xs tracking-wide uppercase transition-colors">
      Authenticate
    </button>
  </form>
</div>
{{end}}
