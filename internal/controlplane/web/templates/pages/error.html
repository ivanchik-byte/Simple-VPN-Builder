<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Code}} — {{.Title}}</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
  <link rel="stylesheet" href="/admin/static/libs/tailwind.min.css">
  <link rel="stylesheet" href="/admin/static/css/theme.css">
</head>
<body class="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased flex items-center justify-center p-4">
  <div class="w-full max-w-md rounded border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-8 shadow-2xl text-center relative overflow-hidden">
    <div class="pointer-events-none absolute inset-x-0 top-0 h-24" style="background: radial-gradient(60% 100% at 50% 0%, {{.Glow}}, transparent 70%)"></div>
    <div class="relative">
      <div class="inline-flex items-center justify-center px-5 h-14 rounded-2xl bg-[var(--bg-hover)] border border-[var(--border-subtle)] mb-4">
        <span class="text-2xl font-mono font-bold" style="color: {{.Accent}}">{{.Code}}</span>
      </div>

      <h1 class="text-lg font-semibold tracking-tight text-[var(--text-primary)] mb-2">{{.Title}}</h1>
      <p class="text-xs text-[var(--text-muted)] font-mono mb-6 leading-relaxed">
        {{.Message}}
      </p>

      {{if .RetryAfter}}
      <div class="tabular-nums mb-6 rounded border border-[var(--border-subtle)] bg-[var(--bg-canvas)] px-4 py-2.5 text-xs text-[var(--text-secondary)]">
        Retrying in <span id="err-countdown" class="font-bold text-[var(--text-primary)]">{{.RetryAfter}}</span>s — or retry right now.
      </div>
      {{end}}

      <div class="flex items-center justify-center gap-3">
        {{if .RetryAfter}}
        <a href="javascript:location.reload()" class="px-4 py-2 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-100 dark:bg-zinc-100 dark:hover:bg-zinc-200 dark:text-zinc-950 text-xs font-medium tracking-wide uppercase transition-colors">
          Retry Now
        </a>
        {{else}}
        <a href="/admin/dashboard" class="px-4 py-2 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-100 dark:bg-zinc-100 dark:hover:bg-zinc-200 dark:text-zinc-950 text-xs font-medium tracking-wide uppercase transition-colors">
          Control Plane
        </a>
        {{end}}
        <button onclick="window.history.back()" type="button" class="px-4 py-2 rounded border border-[var(--border-default)] bg-[var(--bg-hover)] text-[var(--text-secondary)] text-xs font-mono transition-colors cursor-pointer">
          Go Back
        </button>
      </div>
    </div>
  </div>
  {{if .RetryAfter}}
  <script>
    (function () {
      var s = {{.RetryAfter}};
      var el = document.getElementById('err-countdown');
      var iv = setInterval(function () {
        s -= 1;
        if (s <= 0) { clearInterval(iv); location.reload(); return; }
        if (el) el.textContent = s;
      }, 1000);
    })();
  </script>
  {{end}}
</body>
</html>
