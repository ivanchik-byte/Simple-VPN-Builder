<!DOCTYPE html>
<html lang="en" class="{{if eq .Theme "light"}}light{{else}}dark{{end}}" x-data="{
  theme: (function() {
    var m = document.cookie.match(/(?:^|;\s*)vpn_theme=([^;]+)/);
    if (m && (m[1] === 'light' || m[1] === 'dark')) return m[1];
    return localStorage.getItem('vpn_theme') || '{{if eq .Theme "light"}}light{{else}}dark{{end}}';
  })(),
  sidebarOpen: false,
  toggleTheme() {
    this.theme = this.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('vpn_theme', this.theme);
    document.cookie = 'vpn_theme=' + this.theme + '; path=/; max-age=31536000; SameSite=Lax';
    document.documentElement.classList.toggle('dark', this.theme === 'dark');
    document.documentElement.classList.toggle('light', this.theme === 'light');
  }
}">
<head>
  <script>
    (function() {
      var m = document.cookie.match(/(?:^|;\s*)vpn_theme=([^;]+)/);
      var t = (m && (m[1] === 'light' || m[1] === 'dark')) ? m[1] : (localStorage.getItem('vpn_theme') || '{{if eq .Theme "light"}}light{{else}}dark{{end}}');
      if (!m) {
        document.cookie = 'vpn_theme=' + t + '; path=/; max-age=31536000; SameSite=Lax';
      }
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.classList.toggle('light', t === 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{block "title" .}}Control Plane — Simple-VPN-Builder{{end}}</title>
  
  <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS (local build, no CDN) -->
  <link rel="stylesheet" href="/admin/static/libs/tailwind.min.css">

  <!-- Local Theme CSS -->
  <link rel="stylesheet" href="/admin/static/css/theme.css">

  <!-- Embedded HTMX & Alpine.js -->
  <script src="/admin/static/libs/htmx.min.js"></script>
  <script defer src="/admin/static/libs/alpine.min.js"></script>

  <!-- Global Modal Helpers & Security Interceptors -->
  <script>
    // Automatically inject CSRF token to all HTMX requests
    document.addEventListener('htmx:configRequest', function(evt) {
      var csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
      if (csrfToken) {
        evt.detail.headers['X-CSRF-Token'] = csrfToken;
      }
    });

    // Automatically inject CSRF hidden field to all POST forms on submit
    document.addEventListener('submit', function(evt) {
      var form = evt.target;
      if (form && form.method && form.method.toUpperCase() === 'POST') {
        var csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        if (csrfToken && !form.querySelector('input[name="csrf_token"]')) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'csrf_token';
          input.value = csrfToken;
          form.appendChild(input);
        }
      }
    }, true);

    window.openModal = function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.classList.remove('hidden');
        el.classList.add('flex');
        el.style.display = 'flex';
      }
    };
    window.closeModal = function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.classList.remove('flex');
        el.classList.add('hidden');
        el.style.display = 'none';
      }
    };
    window.openPermissionsModal = function(id, email, broadcast, users, delUsers, reset, nodes, plans, audit) {
      var form = document.getElementById('permissions-form');
      if (form) form.action = '/admin/admins/' + id + '/permissions';
      var emailEl = document.getElementById('perm-modal-email');
      if (emailEl) emailEl.textContent = 'Account: ' + email;
      var b = document.getElementById('perm-broadcast');
      if (b) b.checked = Boolean(broadcast);
      var u = document.getElementById('perm-users');
      if (u) u.checked = Boolean(users);
      var du = document.getElementById('perm-del-users');
      if (du) du.checked = Boolean(delUsers);
      var r = document.getElementById('perm-reset');
      if (r) r.checked = Boolean(reset);
      var n = document.getElementById('perm-nodes');
      if (n) n.checked = Boolean(nodes);
      var p = document.getElementById('perm-plans');
      if (p) p.checked = Boolean(plans);
      var a = document.getElementById('perm-audit');
      if (a) a.checked = Boolean(audit);
      window.openModal('permissions-modal');
    };
    window.confirmAction = function(options) {
      var modal = document.getElementById('confirm-modal');
      if (!modal) return true;
      document.getElementById('confirm-modal-title').textContent = options.title || 'Confirm Action';
      document.getElementById('confirm-modal-message').textContent = options.message || 'Are you sure you want to proceed?';
      var btn = document.getElementById('confirm-modal-btn');
      btn.textContent = options.confirmText || 'Confirm';
      if (options.danger !== false) {
        btn.className = 'px-3.5 py-1.5 rounded bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs tracking-wide uppercase transition-colors cursor-pointer';
      } else {
        btn.className = 'px-3.5 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-medium text-xs tracking-wide uppercase transition-colors cursor-pointer';
      }
      btn.onclick = function() {
        window.closeModal('confirm-modal');
        if (typeof options.onConfirm === 'function') {
          options.onConfirm();
        }
      };
      window.openModal('confirm-modal');
      return false;
    };
    window.confirmForm = function(buttonEl, title, message) {
      var form = buttonEl.closest('form');
      if (!form) return true;
      window.confirmAction({
        title: title,
        message: message,
        confirmText: 'Delete',
        danger: true,
        onConfirm: function() {
          var csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
          if (csrfToken && !form.querySelector('input[name="csrf_token"]')) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrf_token';
            input.value = csrfToken;
            form.appendChild(input);
          }
          form.submit();
        }
      });
      return false;
    };
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(function(el) {
          el.classList.remove('flex');
          el.classList.add('hidden');
          el.style.display = 'none';
        });
      }
    });
    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList && e.target.classList.contains('modal-overlay')) {
        e.target.classList.remove('flex');
        e.target.classList.add('hidden');
        e.target.style.display = 'none';
      }
    });
  </script>
</head>
<body class="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased flex flex-col md:flex-row">
  {{if .IsLoginPage}}
    <main class="w-full flex-1 flex items-center justify-center p-4">
      {{template "content" .}}
    </main>
  {{else}}
    <!-- Navigation Sidebar -->
    {{template "sidebar" .}}

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 md:pl-64">
      {{template "header" .}}
      <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
        {{template "content" .}}
      </main>
    </div>

    <!-- AI Infra Copilot Slide-Over Drawer -->
    {{if .CanAccessAICopilot}}
    {{template "ai_drawer" .}}
    {{end}}
  {{end}}

  <!-- Global Custom Confirmation Modal -->
  <div id="confirm-modal" class="modal-overlay fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
    <div class="w-full max-w-sm rounded border border-[var(--border-subtle)] bg-[var(--bg-surface)] p-5 shadow-2xl flex flex-col my-auto">
      <div class="flex items-center space-x-3 mb-3">
        <div class="w-8 h-8 rounded-full bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-500 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <h3 id="confirm-modal-title" class="text-sm font-semibold tracking-tight text-[var(--text-primary)]">Confirm Action</h3>
      </div>
      <p id="confirm-modal-message" class="text-xs text-[var(--text-secondary)] mb-5 leading-relaxed font-mono">Are you sure you want to proceed?</p>
      <div class="flex justify-end space-x-2">
        <button type="button" onclick="closeModal('confirm-modal')" class="px-3 py-1.5 rounded border border-[var(--border-default)] bg-[var(--bg-hover)] text-[var(--text-secondary)] text-xs font-mono cursor-pointer transition-colors">Cancel</button>
        <button id="confirm-modal-btn" type="button" class="px-3.5 py-1.5 rounded bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs tracking-wide uppercase transition-colors cursor-pointer">Confirm</button>
      </div>
    </div>
  </div>
</body>
</html>
