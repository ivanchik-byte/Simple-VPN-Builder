<!DOCTYPE html>
<html lang="en" class="dark" x-data="{
  theme: localStorage.getItem('vpn_theme') || 'dark',
  sidebarOpen: false,
  toggleTheme() {
    this.theme = this.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('vpn_theme', this.theme);
    document.documentElement.classList.toggle('dark', this.theme === 'dark');
    document.documentElement.classList.toggle('light', this.theme === 'light');
  }
}">
<head>
  <script>
    (function() {
      var t = localStorage.getItem('vpn_theme') || 'dark';
      document.documentElement.classList.toggle('dark', t === 'dark');
      document.documentElement.classList.toggle('light', t === 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}Control Plane — Simple-VPN-Builder{{end}}</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS (local build, no CDN) -->
  <link rel="stylesheet" href="/admin/static/css/tailwind.min.css">

  <!-- Local Theme CSS -->
  <link rel="stylesheet" href="/admin/static/css/theme.css">

  <!-- Embedded HTMX & Alpine.js -->
  <script src="/admin/static/js/htmx.min.js"></script>
  <script defer src="/admin/static/js/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased flex flex-col md:flex-row">
  {{if .IsLoginPage}}
    <main class="w-full flex-1 flex items-center justify-center p-4">
      {{template "content" .}}
    </main>
  {{else}}
    <!-- Navigation Sidebar -->
    {{template "sidebar" .}}

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 md:pl-64">
      {{template "header" .}}
      <main class="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
        {{template "content" .}}
      </main>
    </div>
  {{end}}
</body>
</html>
