name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'
  GOLANGCI_LINT_VERSION: 'v1.61.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}
      
      - name: Run linters
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Run tests
        run: go test -race -count=1 ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build control-plane
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/control-plane
      
      - name: Build agent
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/agent

  generate:
    name: Code Generation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Install buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
      
      - name: Install sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      
      - name: Generate protobuf
        run: buf generate
        working-directory: .
      
      - name: Generate sqlc
        run: sqlc generate
        working-directory: .
      
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "Code generation produced changes. Run 'make generate' locally and commit."
            git diff --stat
            exit 1
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build control-plane image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/control-plane.Dockerfile
          push: false
          tags: vpnbuilder-cp:test
          load: true
      
      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/agent.Dockerfile
          push: false
          tags: vpnbuilder-agent:test
          load: true